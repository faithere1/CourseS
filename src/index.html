<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CourseS</title>
<style>
:root {
  --text: #1d1d1f;
  --text-2: rgba(60, 60, 67, .62);
  --text-3: rgba(60, 60, 67, .38);
  --page: #eef0f5;
  --card: rgba(255, 255, 255, .62);
  --card-stroke: rgba(255, 255, 255, .85);
  --hair: rgba(0, 0, 0, .07);
  --field: rgba(118, 118, 128, .075);
  --field-focus: rgba(255, 255, 255, .9);
  --bar: rgba(246, 246, 250, .72);
  --pop: rgba(255, 255, 255, .86);
  --blue: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 12px 32px -14px rgba(24, 39, 75, .22), 0 2px 6px -2px rgba(24, 39, 75, .08);
  --shadow-lift: 0 1px 0 rgba(255,255,255,.7) inset, 0 24px 48px -18px rgba(24, 39, 75, .32), 0 4px 12px -4px rgba(24, 39, 75, .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.22, 1.25, .36, 1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #f5f5f7;
    --text-2: rgba(235, 235, 245, .6);
    --text-3: rgba(235, 235, 245, .32);
    --page: #111114;
    --card: rgba(44, 44, 50, .58);
    --card-stroke: rgba(255, 255, 255, .08);
    --hair: rgba(255, 255, 255, .07);
    --field: rgba(118, 118, 128, .16);
    --field-focus: rgba(70, 70, 78, .7);
    --bar: rgba(30, 30, 34, .6);
    --pop: rgba(44, 44, 50, .92);
    --blue: #0a84ff;
    --red: #ff453a;
    --orange: #ff9f0a;
    --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 12px 32px -14px rgba(0, 0, 0, .6), 0 2px 6px -2px rgba(0, 0, 0, .4);
    --shadow-lift: 0 1px 0 rgba(255,255,255,.08) inset, 0 24px 48px -16px rgba(0, 0, 0, .7), 0 4px 12px -4px rgba(0, 0, 0, .5);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
#app { min-width: 440px; }
body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  color: var(--text);
  background: var(--page);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}
/* Inside the native app the window itself is frosted glass. */
html.native body { background: transparent; }
html.native .ambient { opacity: .6; }

/* Static ambient color — painted once, never animated. */
.ambient {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(40vw 40vw at 8% 0%, rgba(0, 122, 255, .10), transparent 70%),
    radial-gradient(36vw 36vw at 92% 8%, rgba(175, 82, 222, .09), transparent 70%),
    radial-gradient(50vw 40vw at 50% 110%, rgba(52, 199, 89, .06), transparent 70%);
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: default; padding: 0; }
textarea, input { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; }
svg { display: block; }

/* ---------- Header / control bar ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 12px 0 18px;
  background: var(--bar);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--hair);
  animation: barIn .7s var(--spring) both;
}
@keyframes barIn { from { transform: translateY(-100%); opacity: 0; } }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.brand p { margin: 0; font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p b { color: var(--text); font-weight: 600; }

.saved { font-size: 11.5px; color: var(--text-3); display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .4s; }
.saved.on { opacity: 1; transition-duration: .1s; }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 14px; border-radius: 999px;
  font-weight: 600; font-size: 13px;
  background: var(--blue); color: #fff;
  box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--blue) 70%, transparent);
  transition: transform .2s var(--ease), filter .2s;
}
.pill:hover { filter: brightness(1.08); }
.pill:active { transform: scale(.96); }
.pill.ghost { background: var(--field); color: var(--text); box-shadow: none; font-weight: 500; }

.round {
  width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center;
  color: var(--text-2); position: relative; transition: background .15s, color .15s;
}
.round:hover { background: var(--field); color: var(--text); }
.round.on { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
.round .badge {
  position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px; background: var(--text-2); color: var(--page);
  font-size: 9.5px; font-weight: 700; line-height: 15px; text-align: center;
}

/* Add-course sheet, drops down from the bar */
.sheet {
  position: absolute; top: 62px; right: 12px; width: 340px;
  padding: 14px; border-radius: 18px;
  background: var(--pop);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--card-stroke);
  box-shadow: var(--shadow-lift);
  transform-origin: top right;
  animation: sheetIn .38s var(--spring) both;
}
.sheet[hidden] { display: none; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
.sheet h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
.sheet .row { display: flex; gap: 8px; }
.sheet input {
  flex: 1; height: 32px; padding: 0 12px; border-radius: 10px; border: 0; outline: none;
  background: var(--field); transition: box-shadow .2s, background .2s;
}
.sheet input:focus { background: var(--field-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
.sheet .hint { margin-top: 8px; font-size: 11px; color: var(--text-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.trash-list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
.trash-list li { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-top: 1px solid var(--hair); }
.trash-list li:first-child { border-top: 0; }
.trash-list .t-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.trash-list .t-when { font-size: 11px; color: var(--text-3); }
.link { color: var(--blue); font-weight: 600; font-size: 12px; }

/* ---------- Grid of course columns ---------- */
main { padding: 16px; }
.grid {
  --gap: 14px;
  --col-w: 184px;
  display: grid;
  gap: var(--gap);
  /* Never more than 8 per row; fewer when the window is narrow. Rows flow top → down. */
  grid-template-columns: repeat(var(--cols, 1), var(--col-w));
  align-items: stretch;
}

.card {
  --accent: #007aff;
  position: relative;
  display: flex; flex-direction: column;
  min-height: 340px;
  padding: 12px 12px 12px;
  border-radius: 22px;
  background: var(--card);
  border: 1px solid var(--card-stroke);
  box-shadow: var(--shadow);
  transition: box-shadow .3s var(--ease), transform .3s var(--ease), opacity .2s;
  overflow: hidden;
}
.card::before { /* accent hairline on top */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent));
}
.card:hover { box-shadow: var(--shadow-lift); }
.card.dragging { opacity: .35; transform: scale(.97); }
.card.drop-before { box-shadow: -4px 0 0 0 var(--blue), var(--shadow-lift); }
.card.drop-after { box-shadow: 4px 0 0 0 var(--blue), var(--shadow-lift); }

.card-bar { display: flex; align-items: center; gap: 2px; height: 22px; margin: 0 -4px 6px; }
.card-bar .spacer { flex: 1; }
.dot {
  width: 12px; height: 12px; border-radius: 999px; margin: 0 6px 0 4px;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  transition: transform .2s var(--spring);
}
.dot:hover { transform: scale(1.25); }
.grip { width: 18px; height: 22px; display: grid; place-items: center; color: var(--text-3); cursor: grab; }
.grip:active { cursor: grabbing; }
.ib {
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  color: var(--text-2); opacity: 0; transition: opacity .2s, background .15s, color .15s;
}
.card:hover .ib, .card:focus-within .ib { opacity: 1; }
.ib:hover { background: var(--field); color: var(--text); }
.ib:disabled { opacity: 0 !important; pointer-events: none; }
.ib.danger:hover { color: var(--red); }

.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-3); margin: 0 2px 6px;
}
.plus {
  width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent);
  transition: transform .2s var(--spring), background .15s;
}
.plus:hover { background: color-mix(in srgb, var(--accent) 24%, transparent); transform: scale(1.1); }
.plus.open { transform: rotate(45deg); }

/* Dates (directly above the course name) */
.dates { margin-bottom: 8px; }
.date-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.date-list:empty::after {
  content: "No dates yet"; display: block; padding: 6px 2px; font-size: 11.5px; color: var(--text-3);
}
.date-item {
  display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 4px; border-radius: 10px;
  transition: background .15s;
}
.date-item:hover { background: var(--field); }
.cal {
  flex: none; width: 32px; border-radius: 7px; overflow: hidden; text-align: center;
  background: var(--field-focus); box-shadow: 0 0 0 1px var(--hair);
}
.cal .m { display: block; font-size: 8px; font-weight: 700; letter-spacing: .05em; line-height: 12px; color: #fff; background: var(--accent); }
.cal .d { display: block; font-size: 14px; font-weight: 600; line-height: 19px; }
.d-text { flex: 1; min-width: 0; }
.d-label { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.d-rel { display: block; font-size: 11px; color: var(--text-2); }
.date-item.soon .d-rel { color: var(--orange); font-weight: 600; }
.date-item.urgent .d-rel { color: var(--red); font-weight: 600; }
.date-item.past { opacity: .45; }
.date-item.past .cal .m { background: var(--text-3); }
.date-item .ib { width: 20px; height: 20px; }
.date-item:hover .ib { opacity: 1; }

.date-form {
  display: flex; flex-direction: column; gap: 6px; padding: 8px; margin-top: 6px; border-radius: 12px;
  background: var(--field); animation: sheetIn .3s var(--spring) both; transform-origin: top center;
}
.date-form[hidden] { display: none; }
.date-form input {
  width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; outline: none;
  background: var(--field-focus); font-size: 12px;
}
.date-form input:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 50%, transparent); }
.date-form .row { display: flex; gap: 6px; justify-content: flex-end; }
.date-form .pill { height: 24px; padding: 0 10px; font-size: 12px; background: var(--accent); box-shadow: none; }
.date-form .pill.ghost { background: transparent; color: var(--text-2); }

/* Text fields */
textarea {
  display: block; width: 100%; resize: none; border: 0; outline: none; overflow: hidden;
  border-radius: 12px; padding: 8px 10px; background: transparent;
  transition: background .2s, box-shadow .2s;
}
textarea::placeholder { color: var(--text-3); }
textarea:hover { background: var(--field); }
textarea:focus { background: var(--field-focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

.name {
  font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2;
  padding: 6px 8px; margin: 0 -2px 6px; width: calc(100% + 4px);
}
.divider { height: 1px; background: var(--hair); margin: 2px 2px 10px; }
.field { margin-bottom: 10px; }
.field .sec-head { margin-bottom: 4px; }
.status { background: var(--field); min-height: 54px; }
.notes-field { flex: 1; display: flex; flex-direction: column; margin-bottom: 0; }
.notes { flex: 1; min-height: 110px; background: var(--field); line-height: 1.5; }

/* Empty state */
.empty {
  display: grid; place-items: center; text-align: center; padding: 36px 20px 44px;
  animation: sheetIn .6s var(--spring) both;
}
.empty[hidden] { display: none; }
.empty .glyph {
  width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 16px;
  background: linear-gradient(145deg, #4aa3ff, #7b5cff); color: #fff;
  box-shadow: 0 14px 30px -10px rgba(80, 90, 255, .55);
}
.empty h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.02em; }
.empty p { margin: 0 0 18px; color: var(--text-2); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 22px; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 12px 10px 16px; border-radius: 999px;
  background: var(--pop);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--card-stroke); box-shadow: var(--shadow-lift);
  transform: translate(-50%, 0); animation: toastIn .45s var(--spring) both;
}
.toast[hidden] { display: none; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px) scale(.95); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="ambient"></div>

<div id="app">
<header id="bar">
  <div class="brand">
    <h1>Courses</h1>
    <p id="summary">&nbsp;</p>
  </div>
  <span class="saved" id="saved">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Saved
  </span>
  <button class="round" id="trashBtn" title="Recently deleted" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    <span class="badge" id="trashCount">0</span>
  </button>
  <button class="round" id="pinBtn" title="Keep open when clicking elsewhere">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3-1-6z"/><path d="M12 15v6"/></svg>
  </button>
  <button class="round" id="quitBtn" title="Quit CourseS">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
  </button>
  <button class="pill" id="addBtn" title="New course (⌘N)">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Add Course
  </button>

  <form class="sheet" id="addSheet" hidden autocomplete="off">
    <h2>New course</h2>
    <div class="row">
      <input id="addName" placeholder="Course name" maxlength="80">
      <button class="pill" type="submit">Add</button>
    </div>
    <div class="hint">Return to add · Esc to close</div>
  </form>

  <div class="sheet" id="trashSheet" hidden>
    <h2>Recently deleted</h2>
    <ul class="trash-list" id="trashList"></ul>
  </div>
</header>

<main>
  <section class="empty" id="empty" hidden>
    <div>
      <div class="glyph">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>
      </div>
      <h2>No courses yet</h2>
      <p>Add your first course to start tracking it.</p>
      <button class="pill" id="emptyAdd">Add Course</button>
    </div>
  </section>
  <div class="grid" id="grid"></div>
</main>
</div>

<div class="toast" id="toast" hidden>
  <span id="toastText"></span>
  <button class="pill ghost" id="undoBtn" style="height:26px">Undo</button>
</div>

<script>
(() => {
'use strict';

const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.save);
document.documentElement.classList.toggle('native', NATIVE);

const KEY = 'courses.v1';
const PALETTE = ['#007aff', '#af52de', '#ff2d55', '#ff9500', '#34c759', '#30b0c7', '#5856d6', '#ffcc00'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ICON = {
  left: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  trash: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  x: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  grip: '<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/><circle cx="2.5" cy="11.5" r="1.4"/><circle cx="7.5" cy="11.5" r="1.4"/></svg>',
};

/* ---------------- State & persistence ---------------- */
let state = loadState();

function loadState() {
  let d = (window.__INITIAL_DATA__ && typeof window.__INITIAL_DATA__ === 'object') ? window.__INITIAL_DATA__ : null;
  if (!d) { try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} }
  if (!d || !Array.isArray(d.courses)) d = { version: 1, courses: [], trash: [] };
  if (!Array.isArray(d.trash)) d.trash = [];
  for (const c of d.courses) {
    c.id ||= uid(); c.name ??= ''; c.status ??= ''; c.notes ??= '';
    c.color ||= PALETTE[0]; if (!Array.isArray(c.dates)) c.dates = [];
  }
  return d;
}

let saveTimer = null, savedTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
}
function flushSave() {
  clearTimeout(saveTimer); saveTimer = null;
  const json = JSON.stringify(state);
  try { localStorage.setItem(KEY, json); } catch (e) {}
  if (NATIVE) window.webkit.messageHandlers.save.postMessage(json);
  const s = $('#saved');
  s.classList.add('on');
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => s.classList.remove('on'), 1200);
  return json;
}
window.flushSave = () => { return flushSave(); };
window.addEventListener('pagehide', flushSave);
window.addEventListener('blur', () => { if (saveTimer) flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flushSave(); });

/* ---------------- Dates ---------------- */
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayDiff = s => Math.round((parseDay(s) - today()) / 86400000);
const isoToday = () => { const t = today(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
function rel(n) {
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n === -1) return 'Yesterday';
  if (n > 1) return n < 21 ? `in ${n} days` : n < 60 ? `in ${Math.round(n / 7)} weeks` : `in ${Math.round(n / 30)} months`;
  return -n < 21 ? `${-n} days ago` : `${Math.round(-n / 7)} weeks ago`;
}

/* ---------------- Rendering ---------------- */
const grid = $('#grid');

function cardHTML(c, i, n) {
  const dates = [...c.dates].sort((a, b) => a.date.localeCompare(b.date)).map(d => {
    const diff = dayDiff(d.date), day = parseDay(d.date);
    const cls = diff < 0 ? 'past' : diff <= 2 ? 'urgent' : diff <= 7 ? 'soon' : '';
    return `<li class="date-item ${cls}" data-date="${esc(d.id)}" title="${esc(day.toDateString())}">
      <span class="cal"><span class="m">${MONTHS[day.getMonth()]}</span><span class="d">${day.getDate()}</span></span>
      <span class="d-text"><span class="d-label">${esc(d.label || 'Important date')}</span><span class="d-rel">${rel(diff)}</span></span>
      <button class="ib" data-act="del-date" title="Remove date">${ICON.x}</button>
    </li>`;
  }).join('');
  return `
    <div class="card-bar">
      <span class="grip" title="Drag to reorder">${ICON.grip}</span>
      <button class="dot" data-act="color" title="Change color"></button>
      <span class="spacer"></span>
      <button class="ib" data-act="left" title="Move left" ${i === 0 ? 'disabled' : ''}>${ICON.left}</button>
      <button class="ib" data-act="right" title="Move right" ${i === n - 1 ? 'disabled' : ''}>${ICON.right}</button>
      <button class="ib danger" data-act="delete" title="Delete course">${ICON.trash}</button>
    </div>
    <section class="dates">
      <div class="sec-head"><span>Key dates</span><button class="plus" data-act="add-date" title="Add date">${ICON.plus}</button></div>
      <ul class="date-list">${dates}</ul>
      <form class="date-form" hidden autocomplete="off">
        <input type="date" name="date" required>
        <input type="text" name="label" placeholder="Exam, deadline…" maxlength="60">
        <div class="row">
          <button type="button" class="pill ghost" data-act="cancel-date">Cancel</button>
          <button type="submit" class="pill">Add</button>
        </div>
      </form>
    </section>
    <textarea class="name" data-field="name" rows="1" placeholder="Course name" spellcheck="false"></textarea>
    <div class="divider"></div>
    <div class="field">
      <div class="sec-head"><span>Current status</span></div>
      <textarea class="status" data-field="status" rows="2" placeholder="Where are you at?"></textarea>
    </div>
    <div class="field notes-field">
      <div class="sec-head"><span>Notes</span></div>
      <textarea class="notes" data-field="notes" placeholder="Anything worth remembering…"></textarea>
    </div>`;
}

function buildCard(c, i, n) {
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.id = c.id;
  el.style.setProperty('--accent', c.color);
  el.innerHTML = cardHTML(c, i, n);
  for (const ta of el.querySelectorAll('textarea')) ta.value = c[ta.dataset.field] || '';
  return el;
}

function autosize(ta) {
  ta.style.minHeight = '';
  ta.style.flex = 'none';
  ta.style.height = 'auto';
  const h = ta.scrollHeight;
  ta.style.height = ''; ta.style.flex = '';
  ta.style.minHeight = h + 'px';
}

/**
 * Full re-render with FLIP so cards glide to their new spot.
 * `enter` = ids of cards that should drop in from above.
 */
function render({ enter = [], stagger = false } = {}) {
  const before = new Map();
  for (const el of grid.children) before.set(el.dataset.id, el.getBoundingClientRect());

  // keep focus/caret across re-renders
  const a = document.activeElement;
  const focusCard = a && a.closest && a.closest('.card');
  const focus = focusCard && a.dataset.field ? { id: focusCard.dataset.id, f: a.dataset.field, s: a.selectionStart, e: a.selectionEnd } : null;

  const n = state.courses.length;
  const frag = document.createDocumentFragment();
  state.courses.forEach((c, i) => frag.appendChild(buildCard(c, i, n)));
  grid.replaceChildren(frag);
  grid.querySelectorAll('textarea').forEach(autosize);

  [...grid.children].forEach((el, i) => {
    const id = el.dataset.id;
    if (stagger || enter.includes(id)) {
      el.animate(
        [{ transform: 'translateY(-34px) scale(.96)', opacity: 0, filter: 'blur(6px)' },
         { transform: 'none', opacity: 1, filter: 'blur(0)' }],
        { duration: 520, delay: stagger ? i * 30 : 0, easing: 'cubic-bezier(.22,1.2,.36,1)', fill: 'backwards' });
      return;
    }
    const b = before.get(id);
    if (!b) return;
    const r = el.getBoundingClientRect();
    const dx = b.left - r.left, dy = b.top - r.top;
    if (dx || dy) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
      { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });

  if (focus) {
    const ta = grid.querySelector(`.card[data-id="${focus.id}"] textarea[data-field="${focus.f}"]`);
    if (ta) { ta.focus(); ta.setSelectionRange(focus.s, focus.e); }
  }

  $('#empty').hidden = n > 0;
  fitColumns();
  renderSummary();
  renderTrash();
}

function renderSummary() {
  const n = state.courses.length;
  let next = null;
  for (const c of state.courses) for (const d of c.dates) {
    const diff = dayDiff(d.date);
    if (diff >= 0 && (!next || diff < next.diff)) next = { diff, d, c };
  }
  let html = n ? `${n} course${n === 1 ? '' : 's'}` : 'Track every course at a glance';
  if (next) html += ` · Next: <b>${esc(next.d.label || 'Important date')}</b> — ${esc(next.c.name || 'Untitled')}, ${rel(next.diff).toLowerCase()}`;
  $('#summary').innerHTML = html;
}

function renderTrash() {
  const t = state.trash;
  $('#trashBtn').hidden = t.length === 0;
  $('#trashCount').textContent = t.length;
  $('#trashList').innerHTML = t.map((x, i) => `
    <li><span class="t-name">${esc(x.course.name || 'Untitled')}</span>
    <span class="t-when">${new Date(x.deletedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
    <button class="link" data-restore="${i}">Restore</button></li>`).join('');
  if (!t.length) $('#trashSheet').hidden = true;
}

/* ---------------- Actions ---------------- */
const findIdx = id => state.courses.findIndex(c => c.id === id);

function addCourse(name) {
  const used = new Set(state.courses.map(c => c.color));
  const color = PALETTE.find(p => !used.has(p)) || PALETTE[state.courses.length % PALETTE.length];
  const c = { id: uid(), name, status: '', notes: '', color, dates: [], created: Date.now() };
  state.courses.push(c);
  render({ enter: [c.id] });
  scheduleSave();
  const el = grid.querySelector(`.card[data-id="${c.id}"]`);
  el && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function move(from, to) {
  if (to < 0 || to >= state.courses.length || from === to) return;
  const [c] = state.courses.splice(from, 1);
  state.courses.splice(to, 0, c);
  render();
  scheduleSave();
}

let toastTimer = null, lastDeleted = null;
function deleteCourse(id, el) {
  const i = findIdx(id);
  if (i < 0) return;
  const anim = el.animate([{ transform: 'none', opacity: 1 }, { transform: 'scale(.9) translateY(10px)', opacity: 0 }],
    { duration: 220, easing: 'ease-in', fill: 'forwards' });
  anim.onfinish = () => {
    const [c] = state.courses.splice(i, 1);
    state.trash.unshift({ course: c, index: i, deletedAt: Date.now() });
    state.trash = state.trash.slice(0, 50);
    lastDeleted = c.id;
    render();
    scheduleSave();
    $('#toastText').textContent = `Deleted “${c.name || 'Untitled'}”`;
    const t = $('#toast'); t.hidden = true; void t.offsetWidth; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
  };
}

function restore(trashIdx) {
  const [x] = state.trash.splice(trashIdx, 1);
  if (!x) return;
  state.courses.splice(Math.min(x.index ?? state.courses.length, state.courses.length), 0, x.course);
  render({ enter: [x.course.id] });
  scheduleSave();
}

/* ---------------- Card events (delegated) ---------------- */
grid.addEventListener('input', e => {
  const ta = e.target;
  if (!ta.dataset.field) return;
  const c = state.courses[findIdx(ta.closest('.card').dataset.id)];
  if (!c) return;
  c[ta.dataset.field] = ta.value;
  autosize(ta);
  if (ta.dataset.field === 'name') renderSummary();
  scheduleSave();
});

grid.addEventListener('keydown', e => {
  if (e.target.classList.contains('name') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Escape') {
    const f = e.target.closest('.date-form');
    if (f) closeDateForm(f.closest('.card'));
    else if (e.target.tagName === 'TEXTAREA') e.target.blur();
  }
});

function closeDateForm(card) {
  card.querySelector('.date-form').hidden = true;
  card.querySelector('.plus').classList.remove('open');
}

grid.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const card = btn.closest('.card');
  const id = card.dataset.id, i = findIdx(id), c = state.courses[i];
  switch (btn.dataset.act) {
    case 'left': move(i, i - 1); break;
    case 'right': move(i, i + 1); break;
    case 'delete': deleteCourse(id, card); break;
    case 'color': {
      c.color = PALETTE[(PALETTE.indexOf(c.color) + 1) % PALETTE.length];
      card.style.setProperty('--accent', c.color);
      scheduleSave();
      break;
    }
    case 'add-date': {
      const f = card.querySelector('.date-form');
      if (!f.hidden) { closeDateForm(card); break; }
      f.hidden = false;
      btn.classList.add('open');
      f.date.value = isoToday();
      f.label.value = '';
      f.label.focus();
      break;
    }
    case 'cancel-date': closeDateForm(card); break;
    case 'del-date': {
      const li = btn.closest('.date-item');
      c.dates = c.dates.filter(d => d.id !== li.dataset.date);
      li.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(12px)' }], { duration: 180 })
        .onfinish = () => { render(); };
      scheduleSave();
      break;
    }
  }
});

grid.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, card = f.closest('.card');
  const c = state.courses[findIdx(card.dataset.id)];
  if (!f.date.value) { f.date.classList.remove('shake'); void f.offsetWidth; f.date.classList.add('shake'); return; }
  const d = { id: uid(), date: f.date.value, label: f.label.value.trim() };
  c.dates.push(d);
  render();
  scheduleSave();
  const li = grid.querySelector(`[data-date="${d.id}"]`);
  li && li.animate([{ opacity: 0, transform: 'translateY(-8px) scale(.97)' }, { opacity: 1, transform: 'none' }],
    { duration: 380, easing: 'cubic-bezier(.22,1.2,.36,1)' });
});

/* ---------------- Drag to reorder ---------------- */
let dragId = null;
const clearDrop = () => grid.querySelectorAll('.drop-before,.drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));

grid.addEventListener('mousedown', e => {
  const g = e.target.closest('.grip');
  if (g) g.closest('.card').draggable = true;
});
document.addEventListener('mouseup', () => {
  if (!dragId) grid.querySelectorAll('.card[draggable="true"]').forEach(c => c.draggable = false);
});
grid.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.card');
  if (!card || !card.draggable) { e.preventDefault(); return; }
  dragId = card.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
  requestAnimationFrame(() => card.classList.add('dragging'));
});
grid.addEventListener('dragover', e => {
  if (!dragId) return;
  e.preventDefault();
  const card = e.target.closest('.card');
  clearDrop();
  if (!card || card.dataset.id === dragId) return;
  const r = card.getBoundingClientRect();
  card.classList.add(e.clientX > r.left + r.width / 2 ? 'drop-after' : 'drop-before');
});
grid.addEventListener('drop', e => {
  if (!dragId) return;
  e.preventDefault();
  const card = e.target.closest('.card');
  if (card && card.dataset.id !== dragId) {
    const after = card.classList.contains('drop-after');
    const from = findIdx(dragId);
    let to = findIdx(card.dataset.id) + (after ? 1 : 0);
    if (from < to) to--;
    clearDrop();
    move(from, to);
  }
});
grid.addEventListener('dragend', () => {
  clearDrop();
  grid.querySelectorAll('.card').forEach(c => { c.classList.remove('dragging'); c.draggable = false; });
  dragId = null;
});
// Stop stray file drops from navigating away from the app.
document.addEventListener('dragover', e => { if (!dragId) e.preventDefault(); });
document.addEventListener('drop', e => e.preventDefault());

/* ---------------- Header ---------------- */
const sheet = $('#addSheet'), nameInput = $('#addName'), trashSheet = $('#trashSheet');

function openAdd() {
  trashSheet.hidden = true;
  sheet.hidden = false;
  nameInput.value = '';
  nameInput.focus();
}
window.openAdd = openAdd;
const closeAdd = () => { sheet.hidden = true; };

$('#addBtn').addEventListener('click', () => sheet.hidden ? openAdd() : closeAdd());
$('#emptyAdd').addEventListener('click', openAdd);
sheet.addEventListener('submit', e => {
  e.preventDefault();
  const name = nameInput.value.trim();
  if (!name) { nameInput.classList.remove('shake'); void nameInput.offsetWidth; nameInput.classList.add('shake'); return; }
  addCourse(name);
  nameInput.value = '';
  nameInput.focus(); // stay open for adding several in a row
});
$('#trashBtn').addEventListener('click', () => { closeAdd(); trashSheet.hidden = !trashSheet.hidden; });
$('#trashList').addEventListener('click', e => {
  const b = e.target.closest('[data-restore]');
  if (b) restore(+b.dataset.restore);
});
$('#undoBtn').addEventListener('click', () => {
  const i = state.trash.findIndex(x => x.course.id === lastDeleted);
  if (i >= 0) restore(i);
  $('#toast').hidden = true;
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const anyOpen = !sheet.hidden || !trashSheet.hidden || e.target.closest('.date-form') || e.target.tagName === 'TEXTAREA';
    closeAdd(); trashSheet.hidden = true;
    if (!anyOpen) panelMsg({ cmd: 'close' });
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'n' ) { e.preventDefault(); openAdd(); }
});
document.addEventListener('mousedown', e => {
  if (!e.target.closest('#addSheet, #addBtn')) closeAdd();
  if (!e.target.closest('#trashSheet, #trashBtn')) trashSheet.hidden = true;
});

// Refresh "in N days" labels only when the day actually changes (checked on focus — no timers).
let renderedDay = isoToday();
window.addEventListener('focus', () => {
  if (isoToday() !== renderedDay) { renderedDay = isoToday(); render(); }
});

// Re-fit textareas when column widths change (debounced, only while resizing).
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => grid.querySelectorAll('textarea').forEach(autosize), 120);
});

/* ---------------- Menu bar panel sizing ---------------- */
const panelMsg = msg => { if (NATIVE) window.webkit.messageHandlers.panel.postMessage(msg); };
let maxW = Math.min(screen.availWidth - 16, 1600), maxH = screen.availHeight - 40;
const app = $('#app');

// Up to 8 columns per row, fewer if the screen is too narrow. The panel grows with its content.
function fitColumns() {
  const colW = 184, gap = 14, pad = 32;
  const fit = Math.max(1, Math.floor((maxW - pad + gap) / (colW + gap)));
  const cols = Math.max(1, Math.min(8, state.courses.length, fit));
  grid.style.setProperty('--cols', cols);
  app.style.width = Math.max(440, cols * colW + (cols - 1) * gap + pad) + 'px';
}
new ResizeObserver(() => panelMsg({ w: app.offsetWidth, h: app.offsetHeight })).observe(app);

window.onShow = (w, h) => {
  maxW = w; maxH = h;
  render({ stagger: true });
  scrollTo(0, 0);
};

let pinned = false;
$('#pinBtn').addEventListener('click', () => {
  pinned = !pinned;
  $('#pinBtn').classList.toggle('on', pinned);
  panelMsg({ pinned });
});
$('#quitBtn').addEventListener('click', () => { flushSave(); panelMsg({ cmd: 'quit' }); });
if (!NATIVE) { $('#pinBtn').hidden = true; $('#quitBtn').hidden = true; }

render({ stagger: true });
})();
</script>
</body>
</html>
